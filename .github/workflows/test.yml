name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: these jobs only read the repo and run build/lint/test.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        # Homebridge 2 requires Node ^22 || ^24, so those are the only
        # versions this plugin can run under end to end.
        node-version: [22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # `clean` first: bare `tsc` never deletes stale output, so a file removed
    # from src/ leaves its dist/*.js and .d.ts in place — unchanged by the
    # build, invisible to both checks below, and shipped to git installs.
    - name: Build TypeScript
      run: npm run clean && npm run build

    # dist/ is committed (so git installs work); fail if it drifted from src/ or
    # if the build produced untracked files under dist/ that were not committed.
    - name: Verify committed dist is in sync with src
      run: |
        if [ -n "$(git status --porcelain -- dist)" ]; then
          echo "dist/ is dirty, stale, or has untracked files after a clean build:"
          git status --porcelain -- dist
          exit 1
        fi
        git diff --exit-code -- dist

    - name: Run linter
      run: npm run lint

    - name: Typecheck tests
      run: npm run typecheck

    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test

    # The standing config uses forceExit, which would swallow a leaked timer or
    # socket. This runs the whole suite without it, so a leak fails the build
    # rather than depending on someone remembering to check locally.
    - name: Check for leaked handles
      run: npm run test:detect-handles
      env:
        NODE_ENV: test

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: matrix.node-version == '22.x'
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: '24.x'
        cache: 'npm'
    - run: npm ci
    # Audits the whole tree, not just the single production dependency —
    # otherwise OSV-Scanner already covers everything this would report.
    - name: Run npm audit
      run: npm audit --audit-level=high
