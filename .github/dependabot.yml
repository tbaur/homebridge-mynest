# Dependabot keeps dependencies current. The Homebridge runtime path pulls in a
# single third-party runtime dependency, `protobufjs`, used to decode the Nest
# Observe trait stream; everything else goes through Node's native `fetch` and
# `http2`. Updates are grouped to reduce PR noise.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    labels:
      - "dependencies"
    groups:
      # Batch only low-risk patch/minor *development* updates so they stay
      # auto-mergeable. Production (`protobufjs`) and major bumps each arrive
      # as their own PR for deliberate review.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
